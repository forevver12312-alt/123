<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle ornamental outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Crescent Moon -->
  <path d="M 285 105 A 120 120 0 1 0 380 320 A 145 145 0 1 1 285 105 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Islamic Star inside crescent -->
  <polygon points="340,185 348,206 370,206 352,220 358,241 340,229 322,241 328,220 310,206 332,206" fill="#fef08a" />

  <!-- Open Quran Book at bottom center -->
  <g transform="translate(146, 275) scale(0.85)">
    <!-- Book Stand (Rihal) -->
    <path d="M 40 180 L 130 90 L 220 180 L 195 190 L 130 125 L 65 190 Z" fill="#92400e" opacity="0.9" />
    <path d="M 220 180 L 130 90 L 40 180 L 65 190 L 130 125 L 195 190 Z" fill="#78350f" opacity="0.6" />
    
    <!-- Left Page -->
    <path d="M 130 85 C 100 80 50 65 20 85 C 20 125 20 150 20 155 C 50 135 100 150 130 155 Z" fill="#fefce8" stroke="#d97706" stroke-width="2" />
    <!-- Left Page text lines -->
    <line x1="38" y1="100" x2="112" y2="95" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="114" x2="112" y2="109" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="128" x2="112" y2="123" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="142" x2="100" y2="137" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

    <!-- Right Page -->
    <path d="M 130 85 C 160 80 210 65 240 85 C 240 125 240 150 240 155 C 210 135 160 150 130 155 Z" fill="#fefce8" stroke="#d97706" stroke-width="2" />
    <!-- Right Page text lines -->
    <line x1="148" y1="95" x2="222" y2="100" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
    <line x1="148" y1="109" x2="222" y2="114" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
    <line x1="148" y1="123" x2="222" y2="128" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" />
    <line x1="160" y1="137" x2="210" y2="142" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    
    <!-- Spine center glow -->
    <line x1="130" y1="85" x2="130" y2="155" stroke="#b45309" stroke-width="3" />
  </g>
</svg>
